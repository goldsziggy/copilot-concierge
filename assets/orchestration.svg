  <text x="784" y="539" font-family="Arial, Helvetica, sans-serif" fill="#062342" font-size="21">Implement the change</text>
  <text x="784" y="569" font-family="Arial, Helvetica, sans-serif" fill="#062342" font-size="21">Run focused checks</text>
  <text x="784" y="599" font-family="Arial, Helvetica, sans-serif" fill="#062342" font-size="21">Review the evidence</text>
  <text x="560" y="651" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#466175" font-size="21">Specialists report back to the orchestrator. Escalation is available when needed.</text>
