<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1034" viewBox="0 0 1120 1034" role="img" aria-labelledby="title description">
  <title id="title">How Concierge gets an objective done</title>
  <desc id="description">You talk to Concierge, the front agent. Concierge answers simple questions itself, hands everything else to the worker with a brief, and relays the worker's questions, plans and results; its skills are brief and relay. The worker, the back agent, owns each objective and loads skills as the work needs them. It picks the lightest path that finishes the job: a fast path for small, clear work with no skill and no sub-agent; a plan and skills for larger work; or optional sub-agents, at most three at once, when a separate context pays for itself. Every result is verified, lists what was decided for you, suggests next steps and ends with a result line. In guided mode Concierge asks and shows the plan; in full autonomy the worker decides, records each decision and stops only at hard stops; a Copilot SDK client can drive the same plugin unattended. Copilot permissions and your restrictions always apply.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#007e87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}.heading{fill:#062342;font-size:26px;font-weight:700}.body{fill:#466175;font-size:20px}.small{fill:#466175;font-size:18px}.label{fill:#466175;font-size:14px;font-weight:700;letter-spacing:1.4px}.line{fill:none;stroke:#007e87;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.onDark{fill:#d9eff1;font-size:19px}.onDarkLabel{fill:#55e1db;font-size:14px;font-weight:700;letter-spacing:1.4px}.onDarkHead{fill:#ffffff;font-size:22px;font-weight:700}</style>
  </defs>
  <rect width="1120" height="1034" rx="24" fill="#f3f9fa"/>
  <rect x="40" y="40" width="8" height="46" rx="4" fill="#00bfc3"/>
  <text x="65" y="71" fill="#062342" font-size="34" font-weight="750">Two agents. One conversation.</text>
  <text x="65" y="107" class="body">Concierge answers simple questions. The worker does the work, with skills.</text>

  <rect x="40" y="145" width="250" height="160" rx="18" fill="white" stroke="#b9cdd4"/>
  <text x="65" y="184" class="label">YOU</text>
  <text x="65" y="219" class="heading">Share a goal</text>
  <text x="65" y="253" class="body">Or ask a question</text>
  <text x="65" y="283" class="small">Answer what matters</text>
  <path d="M306 225 H342" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="358" y="145" width="316" height="160" rx="18" fill="#062342"/>
  <text x="383" y="184" class="onDarkLabel">FRONT AGENT</text>
  <text x="383" y="219" fill="white" font-size="27" font-weight="700">Concierge</text>
  <text x="383" y="249" class="onDark">Answers simple questions</text>
  <text x="383" y="273" class="onDark">Briefs the worker, relays</text>
  <text x="383" y="293" fill="#55e1db" font-size="15">Skills: brief · relay</text>
  <path d="M690 225 H726" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="742" y="145" width="338" height="160" rx="18" fill="white" stroke="#007e87" stroke-width="2"/>
  <text x="767" y="184" class="label">BACK AGENT · PER OBJECTIVE</text>
  <text x="767" y="219" class="heading">Worker</text>
  <text x="767" y="249" class="body">Plan · execute · verify</text>
  <text x="767" y="273" class="small">Owns the completion claim</text>
  <text x="767" y="293" fill="#007e87" font-size="15">Skills: loaded as the work needs</text>

  <text x="40" y="350" class="body" font-weight="700">The worker picks the lightest path that finishes the job</text>
  <path d="M911 305 V372 H200 V393 M560 372 V393 M911 372 V393" class="line"/>
  <path d="M200 383 V393" class="line" marker-end="url(#arrow)"/>
  <path d="M560 383 V393" class="line" marker-end="url(#arrow)"/>
  <path d="M911 383 V393" class="line" marker-end="url(#arrow)"/>

  <rect x="40" y="406" width="320" height="238" rx="18" fill="white" stroke="#007e87" stroke-width="2"/>
  <text x="64" y="441" class="label">SMALL, CLEAR WORK</text>
  <text x="64" y="476" class="heading">Fast path</text>
  <text x="64" y="512" class="body">Read · change · check · report</text>
  <text x="64" y="543" class="body">One pass by the worker</text>
  <path d="M64 563 H336" stroke="#dce8eb"/>
  <text x="64" y="594" class="small">No skill loaded, no sub-agent</text>
  <text x="64" y="622" class="small">Task list written twice</text>

  <rect x="400" y="406" width="320" height="238" rx="18" fill="white" stroke="#c7d9de"/>
  <text x="424" y="441" class="label">LARGER OR UNCLEAR WORK</text>
  <text x="424" y="476" class="heading">Plan + skills</text>
  <text x="424" y="512" class="body">Outcome and checks first</text>
  <text x="424" y="543" class="body">Skills loaded as needed</text>
  <path d="M424 563 H696" stroke="#dce8eb"/>
  <text x="424" y="594" class="small">Plan · develop · test · debug</text>
  <text x="424" y="622" class="small">Your saved workflows apply</text>

  <rect x="760" y="406" width="320" height="238" rx="18" fill="white" stroke="#c7d9de" stroke-dasharray="7 5"/>
  <text x="784" y="441" class="label">WHEN SEPARATE CONTEXT PAYS</text>
  <text x="784" y="476" class="heading">Sub-agents</text>
  <text x="784" y="512" class="body">Optional · at most three</text>
  <text x="784" y="543" class="body">Handoff in, evidence back</text>
  <path d="M784 563 H1056" stroke="#dce8eb"/>
  <text x="784" y="594" class="small">Independent review of risky work</text>
  <text x="784" y="622" class="small">Your routing rules are honored</text>

  <rect x="40" y="672" width="1040" height="104" rx="18" fill="white" stroke="#b9cdd4"/>
  <text x="64" y="707" class="label">EVERY RESULT</text>
  <text x="64" y="746" class="body">Verified outcome</text>
  <text x="300" y="746" class="body">Decided for you</text>
  <text x="524" y="746" class="body">Suggested next steps</text>
  <text x="792" y="746" class="body">A result line for scripts</text>
  <path d="M276 724 V754 M500 724 V754 M768 724 V754" stroke="#dce8eb" stroke-width="2"/>

  <rect x="40" y="800" width="320" height="130" rx="18" fill="#062342"/>
  <text x="64" y="835" class="onDarkLabel">GUIDED · DEFAULT</text>
  <text x="64" y="870" class="onDarkHead">You stay in the loop</text>
  <text x="64" y="902" class="onDark">Questions, plan, checkpoints</text>
  <rect x="400" y="800" width="320" height="130" rx="18" fill="#062342"/>
  <text x="424" y="835" class="onDarkLabel">FULL AUTONOMY</text>
  <text x="424" y="870" class="onDarkHead">Hand the task over</text>
  <text x="424" y="902" class="onDark">Decides, records, stops if stuck</text>
  <rect x="760" y="800" width="320" height="130" rx="18" fill="#062342"/>
  <text x="784" y="835" class="onDarkLabel">AUTOMATION</text>
  <text x="784" y="870" class="onDarkHead">Copilot SDK client</text>
  <text x="784" y="902" class="onDark">Same plugin, reads the result</text>

  <text x="560" y="974" text-anchor="middle" class="body">Copilot's permissions and your restrictions apply in every mode.</text>
  <text x="560" y="1004" text-anchor="middle" class="small">The worker does the work itself unless a sub-agent earns its cost.</text>
</svg>
