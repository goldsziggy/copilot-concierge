  <text x="424" y="454" font-family="Arial, Helvetica, sans-serif" fill="#466175" font-size="21">Product manager</text>
  <text x="424" y="484" font-family="Arial, Helvetica, sans-serif" fill="#466175" font-size="21">Enterprise UX</text>
  <path d="M424 506 H696" stroke="#dce8eb" />
