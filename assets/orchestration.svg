<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-labelledby="title description">
  <title id="title">Concierge and its working objective lead</title>
  <desc id="description">You talk to Concierge. Concierge routes each objective to Sol, which plans, executes, integrates and verifies using relevant skills and authorized tools. Sol delegates only when a separate context helps or an explicit custom route requires it. Independent review is proportional to risk. Specialists return evidence to Sol. Questions, approval and results return through Concierge. Copilot permissions, required models and learning safeguards remain authoritative.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#007e87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}.heading{fill:#062342;font-size:26px;font-weight:700}.body{fill:#466175;font-size:20px}.small{fill:#466175;font-size:18px}.label{fill:#466175;font-size:14px;font-weight:700;letter-spacing:1.4px}.line{fill:none;stroke:#007e87;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1120" height="860" rx="24" fill="#f3f9fa"/>
  <rect x="40" y="40" width="8" height="46" rx="4" fill="#00bfc3"/>
  <text x="65" y="71" fill="#062342" font-size="34" font-weight="750">One objective. A working lead.</text>
  <text x="65" y="107" class="body">Direct work by default when focused. Separate agents when useful.</text>
  <rect x="40" y="145" width="250" height="136" rx="18" fill="white" stroke="#b9cdd4"/>
  <text x="65" y="184" class="label">YOU</text>
  <text x="65" y="219" class="heading">Share a goal</text>
  <text x="65" y="253" class="body">Answer what matters</text>
  <path d="M306 213 H342" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="358" y="145" width="316" height="136" rx="18" fill="#062342"/>
  <text x="383" y="184" fill="#55e1db" font-size="14" font-weight="700" letter-spacing="1.4">YOUR CONVERSATION</text>
  <text x="383" y="219" fill="white" font-size="27" font-weight="700">Concierge</text>
  <text x="383" y="246" fill="#d9eff1" font-size="20">Questions &amp; plan approval</text>
  <text x="383" y="269" fill="#d9eff1" font-size="18">Objective routing &amp; results</text>
  <path d="M690 213 H726" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="742" y="145" width="338" height="136" rx="18" fill="white" stroke="#007e87" stroke-width="2"/>
  <text x="767" y="184" class="label">WORKING OBJECTIVE LEAD</text>
  <text x="767" y="219" class="heading">Sol</text>
  <text x="767" y="246" class="body">Plan · execute · integrate</text>
  <text x="767" y="269" class="small">Verify &amp; own completion</text>
  <text x="40" y="326" class="body" font-weight="700">One owner keeps related reasoning, implementation and tests together</text>
  <path d="M911 281 V348 H200 V369 M560 348 V369 M911 348 V369" class="line"/>
  <path d="M200 359 V369" class="line" marker-end="url(#arrow)"/>
  <path d="M560 359 V369" class="line" marker-end="url(#arrow)"/>
  <path d="M911 359 V369" class="line" marker-end="url(#arrow)"/>
  <rect x="40" y="382" width="320" height="238" rx="18" fill="white" stroke="#007e87" stroke-width="2"/>
  <text x="64" y="417" class="label">DIRECT EXECUTION</text>
  <text x="64" y="452" class="heading">Skills + tools</text>
  <text x="64" y="488" class="body">Inspect · plan · build · test</text>
  <text x="64" y="519" class="body">Load relevant procedures</text>
  <path d="M64 539 H336" stroke="#dce8eb"/>
  <text x="64" y="570" class="small">Scoped context retrieval</text>
  <text x="64" y="598" class="small">Same Scout helper &amp; safeguards</text>
  <rect x="400" y="382" width="320" height="238" rx="18" fill="white" stroke="#c7d9de"/>
  <text x="424" y="417" class="label">SELECTIVE DELEGATION</text>
  <text x="424" y="452" class="heading">Specialists</text>
  <text x="424" y="488" class="body">Independent investigations</text>
  <text x="424" y="519" class="body">Large context or owned work</text>
  <path d="M424 539 H696" stroke="#dce8eb"/>
  <text x="424" y="570" class="small">Honor explicit custom routes</text>
  <text x="424" y="598" class="small">Return artifacts &amp; evidence</text>
  <rect x="760" y="382" width="320" height="238" rx="18" fill="white" stroke="#c7d9de"/>
  <text x="784" y="417" class="label">PROPORTIONAL VERIFICATION</text>
  <text x="784" y="452" class="heading">Independent review</text>
  <text x="784" y="488" class="body">Meaningful behavior changes</text>
  <text x="784" y="519" class="body">Risky assumptions or requests</text>
  <path d="M784 539 H1056" stroke="#dce8eb"/>
  <text x="784" y="570" class="small">Concrete acceptance criteria</text>
  <text x="784" y="598" class="small">Findings grounded in the diff</text>
  <text x="560" y="658" text-anchor="middle" class="body">Specialists report to Sol. A tracked task does not require another agent.</text>
  <text x="560" y="689" text-anchor="middle" class="small">Copilot permissions and configured models still apply.</text>
  <rect x="40" y="720" width="1040" height="108" rx="18" fill="#062342"/>
  <text x="64" y="761" fill="white" font-size="28" font-weight="700">Talk to your Concierge.</text>
  <text x="64" y="798" fill="#d9eff1" font-size="22">It keeps the conversation moving while Sol gets the objective done.</text>
</svg>
