  <text x="767" y="218" font-family="Arial, Helvetica, sans-serif" fill="#062342" font-size="27" font-weight="700">Orchestrator</text>
  <text x="767" y="243" font-size="21" font-family="Arial, Helvetica, sans-serif" fill="#466175">Plans &amp; delegates</text>
  <text x="767" y="266" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#466175">Checks evidence</text>
  <text x="40" y="317" font-weight="650" font-family="Arial, Helvetica, sans-serif" fill="#062342" font-size="21">Chooses the specialists your task needs</text>
