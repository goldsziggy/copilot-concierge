  <text x="784" y="454" font-family="Arial, Helvetica, sans-serif" fill="#466175" font-size="21">React · Node.js · GraphQL</text>
  <text x="784" y="484" font-family="Arial, Helvetica, sans-serif" fill="#466175" font-size="21">Reviewer</text>
