  <rect x="760" y="369" width="320" height="246" rx="18" fill="white" stroke="#c7d9de" />
  <path d="M800 396 L788 407 L800 418 M817 396 L829 407 L817 418 M811 392 L805 422" fill="none" stroke="#007e87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
