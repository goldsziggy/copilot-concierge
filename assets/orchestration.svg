<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="910" viewBox="0 0 1120 910" role="img" aria-labelledby="title description">
  <title id="title">How Concierge coordinates your work</title>
  <desc id="description">Talk to your Concierge. It talks to the orchestrator for you. No need to be a prompt-engineering expert—let your Concierge take care of that. Concierge handles questions, plan approval and progress. Its orchestrator chooses Scout for source context, private user preferences and verified repository knowledge, planning and design specialists, and implementation and review specialists as needed. Specialists return evidence to the orchestrator. Model choices are configured separately.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#007e87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect width="1120" height="910" rx="24" fill="#f3f9fa" />
  <rect x="40" y="40" width="8" height="46" rx="4" fill="#00bfc3" />
  <text x="65" y="71" font-size="34" font-weight="750" font-family="Arial, Helvetica, sans-serif" fill="#062342">One request. A coordinated team.</text>
  <text x="65" y="107" font-family="Arial, Helvetica, sans-serif" fill="#466175" font-size="21">Native Copilot agents and skills, with you in the conversation.</text>
  <rect x="40" y="145" width="250" height="128" rx="18" fill="white" stroke="#b9cdd4" />
