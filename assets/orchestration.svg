  <text x="784" y="454" font-family="Arial, Helvetica, sans-serif" fill="#466175" font-size="21">React · Node.js · GraphQL</text>
  <text x="784" y="484" font-family="Arial, Helvetica, sans-serif" fill="#466175" font-size="21">Reviewer</text>
  <path d="M784 506 H1056" stroke="#dce8eb" />
  <text x="784" y="539" font-family="Arial, Helvetica, sans-serif" fill="#062342" font-size="21">Implement the change</text>
  <text x="784" y="569" font-family="Arial, Helvetica, sans-serif" fill="#062342" font-size="21">Run focused checks</text>
  <text x="784" y="599" font-family="Arial, Helvetica, sans-serif" fill="#062342" font-size="21">Review the evidence</text>
  <text x="560" y="651" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#466175" font-size="21">Specialists report back to the orchestrator. Escalation is available when needed.</text>
  <text x="560" y="690" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#466175">Roles describe the workflow. Copilot permissions and configured models still apply.</text>
  <rect x="40" y="720" width="1040" height="158" rx="18" fill="#062342" />
  <text x="64" y="760" font-size="28" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#fff">Talk to your Concierge.</text>
  <text x="64" y="792" font-size="23" font-family="Arial, Helvetica, sans-serif" fill="#d9eff1">It talks to the orchestrator for you.</text>
  <text x="64" y="824" font-size="23" font-family="Arial, Helvetica, sans-serif" fill="#d9eff1">No need to be a prompt-engineering expert—</text>
  <text x="64" y="856" font-size="23" font-family="Arial, Helvetica, sans-serif" fill="#d9eff1">let your Concierge take care of that.</text>
