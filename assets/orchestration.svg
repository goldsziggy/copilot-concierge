<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title description">
  <title id="title">How Concierge coordinates your work</title>
  <desc id="description">Talk to your Concierge. It talks to the orchestrator for you. No need to be a prompt-engineering expert—let your Concierge take care of that. Concierge handles questions, plan approval and progress. Its orchestrator chooses Scout for source context and bounded local project notes, planning and design specialists, and implementation and review specialists as needed. Specialists return evidence to the orchestrator. After verified implementation, optional Ship it first asks to run read-only preflight, then asks for separate confirmation of exact details before a draft GitHub pull request or GitLab merge request can be created through existing authorized tools. Model choices are configured separately.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#007e87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
