  <text x="383" y="184" font-family="Arial, Helvetica, sans-serif" fill="#55e1db" font-size="15" font-weight="700" letter-spacing="2">YOUR CONVERSATION</text>
  <text x="383" y="218" font-family="Arial, Helvetica, sans-serif" fill="#fff" font-size="27" font-weight="700">Concierge</text>
  <text x="383" y="243" font-size="21" font-family="Arial, Helvetica, sans-serif" fill="#d9eff1">Questions &amp; plan approval</text>
  <text x="383" y="266" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#d9eff1">Progress &amp; results</text>
